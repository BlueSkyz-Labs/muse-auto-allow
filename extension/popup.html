<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; --blue: #2f6df6; --cream: #f3d9b4; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    /* the check mark is drawn via dashoffset animation — pin its final state so it
       stays visible when animations are disabled (otherwise it would never appear) */
    .head svg .ck { stroke-dashoffset: 0 !important; }
  }
  body { width: 320px; margin: 0; padding: 12px 14px; background: #14151a; color: #e8e8ea;
         font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .head svg { width: 24px; height: 24px; border-radius: 8px; display: block; }
  .head svg .ck { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw .55s ease forwards .05s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  h1 { font-size: 13px; margin: 0; letter-spacing: .02em; color: #fff; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #6ee7a0; margin-left: auto;
         box-shadow: 0 0 0 0 rgba(110,231,160,.45); animation: pulse 2.4s ease-out infinite; }
  .dot.off { background: #5a5f6b; animation: none; box-shadow: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(110,231,160,.45); }
    70% { box-shadow: 0 0 0 7px rgba(110,231,160,0); }
    100% { box-shadow: 0 0 0 0 rgba(110,231,160,0); }
  }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  label.sw { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  input[type=checkbox] { width: 34px; height: 18px; accent-color: var(--blue); cursor: pointer; }
  input[type=number] { width: 74px; background: #1e2027; color: #eee; border: 1px solid #343742;
                       border-radius: 6px; padding: 3px 6px; }
  .muted { color: #9a9ba3; }
  b.count { color: #ffd79a; font-size: 15px; display: inline-block; transition: transform .18s ease; }
  b.count.pop { transform: scale(1.25); }
  .log { margin-top: 10px; border-top: 1px solid #262932; padding-top: 8px; max-height: 220px; overflow: auto; }
  .item { padding: 6px 0; border-bottom: 1px dashed #262932; animation: slidein .22s ease; }
  @keyframes slidein { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .item .t { color: #777; font-variant-numeric: tabular-nums; margin-right: 6px; }
  .item .c { color: #9a9ba3; font-size: 12px; margin-top: 2px; }
  .k { font-size: 10px; padding: 1px 5px; border-radius: 999px; margin-right: 4px; vertical-align: 1px; }
  .k-allow { background: #173a24; color: #6ee7a0; }
  .k-expand { background: #3a3317; color: #e7d76e; }
  .k-open-panel { background: #17253a; color: #7cc0ff; }
  .chip { margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid #2a3242; color: #9aa3b2; white-space: nowrap; }
  .chip.on { color: #6ee7a0; border-color: #1f4a33; }
  .chip.off { color: #e7d76e; border-color: #4a4426; }
  .mini { margin-top: 8px; }
  .mcap { font-size: 11px; margin-bottom: 2px; }
  .mini svg { display: block; }
  .mini rect { transition: opacity .15s ease; }
  .mini rect:hover { opacity: .8; }
  .btn { background: #1e2027; color: #e8e8ea; border: 1px solid #343742; border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  .btn:hover { border-color: var(--blue); }
  .note { font-size: 11px; margin-left: auto; }
  .empty { color: #777; padding: 6px 0; }
</style>
</head>
<body>
  <div class="head">
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <rect x="16" y="16" width="480" height="480" rx="132" fill="#f3d9b4"/>
      <path class="ck" d="M120 282 L214 376 L372 176" fill="none" stroke="#2f6df6" stroke-width="72"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1 data-i18n="extName">Muse Auto-Allow</h1>
    <span class="dot" id="dot"></span>
  </div>
  <label class="sw"><input type="checkbox" id="enabled"> <span data-i18n="toggleLabel">Auto-click Allow</span></label>
  <div class="row"><span class="muted" data-i18n="delayLabel">Delay between clicks:</span>
    <input type="number" id="delay" min="0" max="10000" step="100"> <span class="muted">ms</span></div>
  <div class="row"><span class="muted" data-i18n="clickedLabel">Clicked:</span><b class="count" id="count">0</b></div>
  <div class="row"><span class="muted" data-i18n="todayLabel">Today:</span><b class="count" id="today" style="font-size:13px">0</b><span class="chip" id="musestat">&hellip;</span></div>
  <div class="mini"><div class="mcap muted" data-i18n="last7">Last 7 days</div><svg id="mini" width="292" height="46" aria-hidden="true"></svg></div>
  <div class="row"><button class="btn" id="openstats" data-i18n="statsOpen">Statistics</button><span class="muted note" data-i18n="onlyMuse">Works only on muse.ai</span></div>
  <div class="log" id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
