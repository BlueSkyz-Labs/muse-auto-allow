<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muse Auto-Allow — Statistics</title>
<style>
  /* Quiet Luxury — tokens per docs/QUIET_LUXURY_SPEC.md §2 (Phase 2 / P2-4). */
  :root { color-scheme: light dark;
          --bg: #faf9f7; --surface: #ffffff;
          --ink: #17181c; --ink-2: #3a3d44; --muted: #5c6069;
          --line: #e8e6e0; --divide: rgba(23,24,28,.10); --stroke: rgba(23,24,28,.16); --stroke-hover: rgba(23,24,28,.20);
          --fill: rgba(23,24,28,.045); --fill-hover: rgba(23,24,28,.075);
          --btn-ink: #17181c; --on-btn: #ffffff;
          --accent-tint: rgba(0,90,191,.10); --accent-line: rgba(0,90,191,.28); --accent-text: #005abf;
          --axis: rgba(23,24,28,.20); --hairline: rgba(23,24,28,.07); --grid: rgba(23,24,28,.22); --focus: #005abf;
          --dur-1: 120ms; --ease-out: cubic-bezier(.22,.61,.36,1); --ease-io: cubic-bezier(.45,.05,.55,.95);
          /* data-viz palette — light stops (every stop >= 4.5:1 on --surface) */
          --c-blue: #0f63e6;   --c-blue-b: #0a4fc4;
          --c-rose: #c2263f;   --c-rose-b: #a51e35;
          --c-teal: #0e8571;   --c-teal-b: #0a6d5d;
          --c-amber: #bf5700;  --c-amber-b: #a34705;
          --c-violet: #6d3ad6; --c-violet-b: #5c2fb8;
          /* trend chart: single-hue bars + brand-deep accent for the latest ('today') bar */
          --c-now: #0040DC; --c-now-m: #0030b0; --c-now-b: #00289c; --now-ink: #005abf;
          /* glyph ink for tinted chips (deeper in light, brighter in dark) */
          --c-blue-g: #0a4fc4; --c-rose-g: #a51e35; --c-teal-g: #0a6d5d; --c-violet-g: #5c2fb8; --c-amber-g: #a34705;
          --sh-1: 0 1px 2px rgba(23,24,28,.05);
          --sh-2: 0 1px 1px rgba(23,24,28,.03), 0 14px 34px -22px rgba(23,24,28,.26);
          --sh-3: 0 2px 6px rgba(23,24,28,.05), 0 28px 60px -30px rgba(23,24,28,.38); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161719; --surface: #1f2023;
            --ink: #eceef2; --ink-2: #c9cdd4; --muted: #a6abb5;
            --line: #2c2e33; --divide: rgba(236,238,242,.18); --stroke: rgba(236,238,242,.16); --stroke-hover: rgba(236,238,242,.28);
            --fill: rgba(236,238,242,.06); --fill-hover: rgba(236,238,242,.10);
            --btn-ink: #e9ebef; --on-btn: #17181c;
            --accent-tint: rgba(10,92,224,.22); --accent-line: rgba(10,92,224,.50); --accent-text: #8ab8ff;
            --axis: rgba(228,230,235,.36); --hairline: rgba(228,230,235,.08); --grid: rgba(228,230,235,.40); --focus: #7cb0ff;
            /* data-viz palette — dark stops (every stop >= 4.5:1 on --surface) */
            --c-blue: #5aa5ff;   --c-blue-b: #3f8ceb;
            --c-rose: #ff8296;   --c-rose-b: #f06680;
            --c-teal: #35d2b8;   --c-teal-b: #22b89e;
            --c-amber: #f2b435;  --c-amber-b: #dfa11c;
            --c-violet: #ab93fb; --c-violet-b: #9a83f5;
            --c-now: #a9caff; --c-now-m: #97c0ff; --c-now-b: #7fb0ff; --now-ink: #7cb0ff;
            --c-blue-g: #5aa5ff; --c-rose-g: #ff8296; --c-teal-g: #35d2b8; --c-violet-g: #ab93fb; --c-amber-g: #f2b435;
            --sh-1: 0 1px 2px rgba(0,0,0,.35);
            --sh-2: 0 1px 1px rgba(0,0,0,.30), 0 16px 36px -24px rgba(0,0,0,.75);
            --sh-3: 0 2px 8px rgba(0,0,0,.45), 0 30px 64px -32px rgba(0,0,0,.90); }
  }
  body { margin: 0; padding: 24px 32px; background: var(--bg); color: var(--ink);
         font: 14px/1.55 "Optimistic", "optimisticAI", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; }

  /* micro-caption tier (spec §2.6): short captions + KPI labels only — CSS-only uppercase */
  .micro { font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  /* ---- header: title + range control ---- */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  h1 { font-size: 24px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.25; margin: 0; display: flex; align-items: center; gap: 11px; color: var(--ink); }
  h1 svg.logo { width: 30px; height: 30px; border-radius: 9px; box-shadow: 0 8px 20px -9px rgba(0,64,220,.6); }

  .seg { display: inline-flex; gap: 4px; background: var(--fill); border-radius: 999px; padding: 4px;
         box-shadow: inset 0 0 0 1px var(--hairline); }
  .seg button { background: transparent; border: 0; color: var(--muted); padding: 6px 18px; border-radius: 999px;
                cursor: pointer; font: inherit; font-weight: 500;
                transition: background var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out); }
  .seg button:hover { background: var(--fill-hover); color: var(--ink); }
  /* active = graphite (light) / ivory (dark) pill — the blue pill was the loudest element */
  .seg button.active { background: var(--btn-ink); color: var(--on-btn); box-shadow: var(--sh-1); }
  .seg button.active:hover { background: var(--btn-ink); color: var(--on-btn); }

  /* ---- KPI cards ---- */
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
  .kpi { position: relative; display: flex; align-items: center; gap: 13px; overflow: hidden;
         background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
         padding: 16px 20px; box-shadow: var(--sh-2); }
  .kpi::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
                 background: radial-gradient(100% 140% at 0% 0%, color-mix(in srgb, var(--kc) 8%, transparent), transparent 60%); }
  .kpi .ic { position: relative; flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
             color: var(--kc-g); background: color-mix(in srgb, var(--kc) 8%, transparent);
             box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--kc) 16%, transparent); }
  .kpi .ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
  .kpi .kv { position: relative; display: flex; flex-direction: column; min-width: 0; }
  .kpi .v { font-size: 30px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .k-blue   { --kc: var(--c-blue);   --kc-g: var(--c-blue-g); }
  .k-rose   { --kc: var(--c-rose);   --kc-g: var(--c-rose-g); }
  .k-teal   { --kc: var(--c-teal);   --kc-g: var(--c-teal-g); }
  .k-violet { --kc: var(--c-violet); --kc-g: var(--c-violet-g); }
  .k-amber  { --kc: var(--c-amber);  --kc-g: var(--c-amber-g); }

  /* ---- chart ---- */
  .chart { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px; margin-bottom: 16px; box-shadow: var(--sh-2); }
  .chart .ccap { font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .chart svg { display: block; width: 100%; height: auto; }
  .chart line.base { stroke: var(--axis); stroke-width: 1.25; }
  .chart line.grid { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 3 4; }
  .chart rect.bar { transition: filter var(--dur-1) var(--ease-out); }
  .chart rect.bar.now { stroke: var(--now-ink); stroke-width: 1.5; }
  .chart rect.bar:hover { filter: brightness(1.04); }
  .chart text { fill: var(--muted); font-size: 11px; letter-spacing: .01em; }
  .chart text.val { fill: var(--ink); font-size: 11px; font-weight: 500; }
  .chart text.tick { font-size: 10.5px; letter-spacing: .02em; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
  .chart text.now { fill: var(--now-ink); font-weight: 600; }
  .chart text.val.now { fill: var(--now-ink); }

  /* data-viz color classes: trend-chart gradient stops (single hue + brand accent).
     The five-hue palette below (t-*) is categorical only — topics + KPI chips. */
  .sc-blue { stop-color: var(--c-blue); }  .sc-blue-b { stop-color: var(--c-blue-b); }
  .sc-now { stop-color: var(--c-now); }    .sc-now-m { stop-color: var(--c-now-m); }  .sc-now-b { stop-color: var(--c-now-b); }
  .t-blue   { --tc: var(--c-blue); }
  .t-rose   { --tc: var(--c-rose); }
  .t-teal   { --tc: var(--c-teal); }
  .t-amber  { --tc: var(--c-amber); }
  .t-violet { --tc: var(--c-violet); }

  /* ---- topics ---- */
  .topics { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px; box-shadow: var(--sh-2); }
  .topics .cap { font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .topic { display: flex; align-items: center; gap: 11px; padding: 5px 0; }
  .topic + .topic { border-top: 1px solid var(--divide); }
  .topic .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--tc, var(--muted));
                box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc, var(--muted)) 12%, transparent); }
  .topic .name { width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .topic .bar { flex: 1; height: 8px; background: var(--fill); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .topic .bar i { display: block; height: 100%; width: 0; border-radius: 999px;
                  background: var(--tc, var(--c-blue));
                  transition: width .35s var(--ease-io); }
  .topic .n { width: 56px; text-align: right; color: var(--ink); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 10px 0; }

  /* ---- footer ---- */
  .footrow { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .foot { color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .01em; }
  .tools { display: flex; gap: 8px; }
  /* neutral controls are outlined, not filled (spec §3 #3) */
  .tool { background: transparent; color: var(--ink); border: 1px solid var(--stroke); border-radius: 999px;
          padding: 7px 16px; cursor: pointer; font: inherit; font-weight: 500; box-shadow: var(--sh-1);
          transition: background var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out); }
  .tool:hover { background: var(--fill); border-color: var(--stroke-hover); }
  /* primary = graphite (light) / ivory (dark); accent is reserved for state */
  .tool.primary { background: var(--btn-ink); border-color: var(--btn-ink); color: var(--on-btn); }
  .tool.primary:hover { background: color-mix(in srgb, var(--btn-ink) 94%, var(--bg)); border-color: var(--btn-ink); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(23,24,28,.18); border-radius: 999px; }
  ::-webkit-scrollbar-track { background: transparent; }
  @media (prefers-color-scheme: dark) { ::-webkit-scrollbar-thumb { background: rgba(236,238,242,.22); } }
  /* narrow widths (WCAG 1.4.10 reflow): the header wraps and the segmented control
     shrinks/wraps instead of pushing the page into horizontal scroll (measured 475px
     wide at 320 CSS px before this fix); 1280x800 renders are unaffected (media query only) */
  @media (max-width: 480px) {
    body { padding: 16px 16px 18px; }
    .head { gap: 10px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } /* KPI values stay visible (measured 0px wide at 4 columns) */
    .seg { flex-wrap: wrap; }
    .seg button { padding: 6px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <header class="head">
    <h1>
      <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="hbg" x1="72" y1="60" x2="452" y2="464" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0082FB"/><stop offset="0.62" stop-color="#0064E0"/><stop offset="1" stop-color="#0040DC"/></linearGradient></defs><rect x="16" y="16" width="480" height="480" rx="133" fill="url(#hbg)"/><path d="M124 284 L214 374 L368 182" fill="none" stroke="#fff" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="statsTitle">Muse Auto-Allow — Statistics</span>
    </h1>
    <div class="seg" id="seg">
      <button data-range="day" class="active" aria-pressed="true" data-i18n="rangeDay">Day</button>
      <button data-range="week" aria-pressed="false" data-i18n="rangeWeek">Week</button>
      <button data-range="month" aria-pressed="false" data-i18n="rangeMonth">Month</button>
      <button data-range="year" aria-pressed="false" data-i18n="rangeYear">Year</button>
    </div>
  </header>

  <div class="grid">
    <div class="kpi k-blue">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.6l4.4 4.4L19 6.4"/></svg></span>
      <span class="kv"><span class="v" id="kTotal">0</span><span class="l" data-i18n="totalLabel">Total</span></span>
    </div>
    <div class="kpi k-rose">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4V12l3.1 2.1"/></svg></span>
      <span class="kv"><span class="v" id="kToday">0</span><span class="l" data-i18n="todayLabel">Today</span></span>
    </div>
    <div class="kpi k-teal">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 9.8h17"/><circle cx="12" cy="14.8" r="1.9"/></svg></span>
      <span class="kv"><span class="v" id="kWeek">0</span><span class="l" data-i18n="weekLabel">This week</span></span>
    </div>
    <div class="kpi k-amber">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M8 3.2v3.6M16 3.2v3.6M3.5 10.2h17"/></svg></span>
      <span class="kv"><span class="v" id="kMonth">0</span><span class="l" data-i18n="monthLabel">This month</span></span>
    </div>
  </div>

  <div class="chart"><div class="ccap" id="ccap"></div><svg id="chart" viewBox="0 0 720 158" role="img"></svg></div>

  <div class="topics">
    <div class="cap" data-i18n="topicsTitle">By topic (repo / project)</div>
    <div id="topics"></div>
  </div>

  <div class="footrow">
    <span class="foot" data-i18n="onlyMuse">Works on muse.ai and chatgpt.com</span>
    <span class="tools">
      <button class="tool" id="importData" data-i18n="importData">Import data</button>
      <button class="tool primary" id="exportData" data-i18n="exportData">Export data</button>
    </span>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none">
  <script src="stats.js"></script>
</body>
</html>
