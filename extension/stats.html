<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muse Auto-Allow — Statistics</title>
<style>
  :root { color-scheme: dark; --blue: #2f6df6; --cream: #f3d9b4; }
  body { margin: 0; padding: 16px 32px; background: #14151a; color: #e8e8ea;
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 10px; display: flex; align-items: center; gap: 10px; color: #fff; }
  h1 svg { width: 26px; height: 26px; border-radius: 8px; }
  .grid { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .kpi { background: #1a1c22; border: 1px solid #262932; border-radius: 12px; padding: 10px 20px; min-width: 118px; }
  .kpi .v { font-size: 24px; font-weight: 700; color: #ffd79a; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 12px; color: #a8b1c2; margin-top: 2px; }
  .seg { display: inline-flex; gap: 4px; background: #1a1c22; border: 1px solid #262932; border-radius: 10px; padding: 4px; margin-bottom: 12px; }
  .seg button { background: transparent; border: 0; color: #9aa3b2; padding: 6px 16px; border-radius: 7px; cursor: pointer; font: inherit; }
  .seg button.active { background: var(--blue); color: #fff; }
  .chart { background: #1a1c22; border: 1px solid #262932; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .chart .ccap { font-size: 12px; color: #a8b1c2; margin-bottom: 8px; }
  .chart svg { display: block; width: 100%; height: auto; }
  .chart rect.bar { fill: var(--blue); opacity: .9; transition: opacity .15s ease; }
  .chart rect.bar:hover { opacity: 1; }
  .chart text { fill: #a8b1c2; font-size: 11px; }
  .chart text.val { fill: #ffd79a; font-size: 10px; }
  .topics { background: #1a1c22; border: 1px solid #262932; border-radius: 12px; padding: 12px; }
  .topics .cap { font-size: 12px; color: #a8b1c2; margin-bottom: 10px; }
  .topic { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .topic .name { width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #cfd6e4; }
  .topic .bar { flex: 1; height: 10px; background: #11151d; border-radius: 999px; overflow: hidden; }
  .topic .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2f6df6, #5fb2ff); border-radius: 999px; transition: width .35s ease; }
  .topic .n { width: 58px; text-align: right; color: #ffd79a; font-variant-numeric: tabular-nums; }
  .empty { color: #777; padding: 8px 0; }
  .foot { color: #7d8698; font-size: 12px; margin-top: 10px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <h1>
    <svg viewBox="0 0 512 512" aria-hidden="true"><rect x="16" y="16" width="480" height="480" rx="132" fill="#f3d9b4"/><path d="M120 282 L214 376 L372 176" fill="none" stroke="#2f6df6" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span data-i18n="statsTitle">Muse Auto-Allow — Statistics</span>
  </h1>

  <div class="grid">
    <div class="kpi"><div class="v" id="kTotal">0</div><div class="l" data-i18n="totalLabel">Total</div></div>
    <div class="kpi"><div class="v" id="kToday">0</div><div class="l" data-i18n="todayLabel">Today</div></div>
    <div class="kpi"><div class="v" id="kWeek">0</div><div class="l" data-i18n="weekLabel">This week</div></div>
    <div class="kpi"><div class="v" id="kMonth">0</div><div class="l" data-i18n="monthLabel">This month</div></div>
  </div>

  <div class="seg" id="seg">
    <button data-range="day" class="active" data-i18n="rangeDay">Day</button>
    <button data-range="week" data-i18n="rangeWeek">Week</button>
    <button data-range="month" data-i18n="rangeMonth">Month</button>
    <button data-range="year" data-i18n="rangeYear">Year</button>
  </div>

  <div class="chart"><div class="ccap" id="ccap"></div><svg id="chart" viewBox="0 0 720 175" role="img"></svg></div>

  <div class="topics">
    <div class="cap" data-i18n="topicsTitle">By topic (repo/project)</div>
    <div id="topics"></div>
  </div>

  <div class="foot" data-i18n="onlyMuse">Works only on muse.ai</div>
  <script src="stats.js"></script>
</body>
</html>
