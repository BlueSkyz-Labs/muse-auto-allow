<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muse approvals fixture</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b0b0c; color: #eee; padding: 24px; }
  .card { border: 1px solid #333; border-radius: 12px; padding: 16px; margin: 12px 0; background: #151517; }
  button { padding: 8px 18px; border-radius: 999px; border: 0; margin-right: 8px; font-size: 14px; cursor: pointer; }
  .allow { background: #2f6df6; color: #fff; }
  .deny { background: #333; color: #ddd; }
  .pending { background: #1b2438; color: #cfe1ff; text-align: left; border-radius: 10px; }
</style>
</head>
<body>
<h2>Needs review</h2>

<!-- path B: classic Allow+Deny pairs -->
<div class="card" id="card1">
  <p>Allow Muse to perform this action on your GitHub account?</p>
  <div class="row">
    <button type="button" class="allow" id="allow1">Allow</button>
    <button type="button" class="deny" id="deny1">Deny</button>
  </div>
</div>

<div class="card" id="card2">
  <p>Second request</p>
  <div class="row">
    <button type="button" class="allow" id="allow2">Allow</button>
    <button type="button" class="deny" id="deny2">Deny</button>
  </div>
</div>

<!-- path A: Muse-marked card -->
<div class="card" data-testid="hatch-inline-approval-card" id="card4">
  <p>Inline marked approval</p>
  <div class="row">
    <button type="button" class="allow" id="allow4">Allow</button>
    <button type="button" class="deny" id="deny4">Deny</button>
  </div>
</div>

<!-- negative controls: must NEVER be clicked -->
<p><button type="button" class="allow" id="lone">Allow</button></p>
<p><button type="button" class="allow" id="notif">Allow notifications</button>
   <button type="button" class="deny" id="block">Block</button></p>

<!-- path C: collapsed pending card -->
<button type="button" id="pending5" class="pending">Allow Muse to perform this action on your GitHub account? Your assistant wants to create or update files in the GitHub repository.</button>

<!-- path D: background approval surface -->
<div id="surface" data-testid="hatch-inline-approval-card" data-hatch-background-approval-surface="true" class="card">
  <span>2 tasks need your approval</span>
  <button type="button" id="surfaceBtn">Review</button>
</div>

<!-- redteam case: dedup probe — clicking Allow replaces the card with an IDENTICAL one (re-render race) -->
<div class="card" id="card7">
  <p>Dedup probe request</p>
  <div class="row">
    <button type="button" class="allow" id="allow7">Allow</button>
    <button type="button" class="deny" id="deny7">Deny</button>
  </div>
</div>

<!-- redteam case: allow button inside an <a> must NEVER be clicked -->
<div class="card" id="card8">
  <p>Anchor probe</p>
  <div class="row">
    <a href="#noop"><button type="button" class="allow" id="allow8">Allow</button></a>
    <button type="button" class="deny" id="deny8">Deny</button>
  </div>
</div>

<!-- redteam case: consent-only pair (notifications) must NEVER be clicked -->
<div class="card" id="card9">
  <p>Allow notifications to keep you posted about updates?</p>
  <div class="row">
    <button type="button" class="allow" id="allow9">Allow</button>
    <button type="button" class="deny" id="deny9">Deny</button>
  </div>
</div>

<!-- redteam case: surface whose only button is NOT an open/review intent -> must NOT be clicked -->
<div id="surface2" data-testid="hatch-inline-approval-card" data-hatch-background-approval-surface="true" class="card">
  <span>3 tasks need your approval</span>
  <button type="button" id="surfaceBtn2">Delete everything</button>
</div>

<script>
window.__clicks = [];
window.__errors = [];
window.addEventListener('error', (e) => window.__errors.push(String(e.message)));
// probe: is the PAGE's own JS still running when clicks stop? (freeze vs script-death)
window.__probe = { start: Date.now(), ticks: 0, last: 0 };
setInterval(function () { window.__probe.ticks++; window.__probe.last = Date.now(); }, 500);
function rec(n, extra) { window.__clicks.push(Object.assign({ n: n, t: Date.now() }, extra || {})); }
function wirePair(scope, id) {
  scope.querySelector('#allow' + id).addEventListener('click', function () {
    rec(id, { allow: true });
    var c = document.getElementById('card' + id); if (c) c.remove();
  });
  scope.querySelector('#deny' + id).addEventListener('click', function () {
    rec(id, { deny: true });
    var c = document.getElementById('card' + id); if (c) c.remove();
  });
}
wirePair(document, 1);
wirePair(document, 2);
wirePair(document, 4);

document.getElementById('lone').addEventListener('click', function () { rec('lone', { allow: true }); });
document.getElementById('notif').addEventListener('click', function () { rec('notif', { allow: true }); });

// path C: expanding a collapsed pending card reveals the pair
document.getElementById('pending5').addEventListener('click', function () {
  rec('pending5');
  var d = document.createElement('div');
  d.className = 'card'; d.id = 'card5';
  d.innerHTML = '<p>Expanded pending</p><div class="row">' +
    '<button type="button" class="allow" id="allow5">Allow</button>' +
    '<button type="button" class="deny" id="deny5">Deny</button></div>';
  this.replaceWith(d);
  wirePair(d, 5);
});

// path D: surface button opens the panel and reveals a pair
document.getElementById('surfaceBtn').addEventListener('click', function () {
  rec('surface');
  var s = document.getElementById('surface'); if (s) s.remove();
  var d = document.createElement('div');
  d.className = 'card'; d.id = 'card6';
  d.innerHTML = '<p>Panel opened</p><div class="row">' +
    '<button type="button" class="allow" id="allow6">Allow</button>' +
    '<button type="button" class="deny" id="deny6">Deny</button></div>';
  document.body.appendChild(d);
  wirePair(d, 6);
});

// redteam case: dedup — first click replaces card7 with an identical card (new nodes, same text).
// With the fingerprint dedup the replacement must NOT be clicked again (within the dedup window).
var replaced7 = false;
function wire7() {
  document.getElementById('allow7').addEventListener('click', function () {
    rec(7, { allow: true });
    if (!replaced7) {
      replaced7 = true;
      var old = document.getElementById('card7');
      var d = document.createElement('div');
      d.className = 'card'; d.id = 'card7';
      d.innerHTML = '<p>Dedup probe request</p><div class="row">' +
        '<button type="button" class="allow" id="allow7">Allow</button>' +
        '<button type="button" class="deny" id="deny7">Deny</button></div>';
      old.replaceWith(d);
      wire7();
    } else {
      var c = document.getElementById('card7'); if (c) c.remove();
    }
  });
}
wire7();

// redteam case: anchor-contained allow must never be clicked
document.getElementById('allow8').addEventListener('click', function () { rec(8, { allow: true }); });

// redteam case: consent-only allow must never be clicked
document.getElementById('allow9').addEventListener('click', function () { rec(9, { allow: true }); });

// redteam case: dangerous surface button must never be clicked
document.getElementById('surfaceBtn2').addEventListener('click', function () { rec('surface2'); });

// late card (MutationObserver)
setTimeout(function () {
  var div = document.createElement('div');
  div.className = 'card'; div.id = 'card3';
  div.innerHTML = '<p>Late request</p><div class="row">' +
    '<button type="button" class="allow" id="allow3">Allow</button>' +
    '<button type="button" class="deny" id="deny3">Deny</button></div>';
  document.body.appendChild(div);
  wirePair(div, 3);
}, 2500);
</script>
</body>
</html>
