<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muse Auto-Allow small icon (16/32)</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!-- Small-size variant: same tile, bolder check so it stays legible at 16px. -->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="72" y1="60" x2="452" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0082FB"/>
      <stop offset="0.62" stop-color="#0064E0"/>
      <stop offset="1" stop-color="#0040DC"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="133" fill="url(#bg)"/>
  <path d="M106 280 L206 378 L386 164" fill="none" stroke="#ffffff" stroke-width="86"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</body>
</html>
