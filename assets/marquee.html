<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; background: #fcfcfc;
               color: #111112; font-family: "Optimistic", "optimisticAI", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); }
  .b1 { width: 520px; height: 520px; background: #f3d9b4; left: -160px; top: -200px; opacity: .5; }
  .b2 { width: 500px; height: 500px; background: #cfe2ff; right: -160px; bottom: -220px; opacity: .8; }
  .wrap { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 0; text-align: center; }
  .tile { width: 124px; height: 124px; border-radius: 32px; box-shadow: 0 14px 40px rgba(0,64,220,.18); }
  h1 { margin: 22px 0 0; font-size: 52px; font-weight: 500; letter-spacing: -0.015em; }
  p { margin: 12px 0 0; color: #4a4e54; font-size: 20px; }
  .chips { display: flex; gap: 12px; margin-top: 26px; }
  .chip { background: rgba(17,17,18,.07); color: #2c2e33; font-size: 15px; font-weight: 500;
          padding: 9px 18px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="wrap">
    <svg class="tile" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="bg" x1="72" y1="60" x2="452" y2="464" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#0082FB"/><stop offset="0.62" stop-color="#0064E0"/><stop offset="1" stop-color="#0040DC"/>
      </linearGradient></defs>
      <rect x="16" y="16" width="480" height="480" rx="133" fill="url(#bg)"/>
      <path d="M118 284 L208 374 L362 182" fill="none" stroke="#fff" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Muse Auto-Allow</h1>
    <p>Approvals on autopilot &mdash; every Allow, instantly. Local-only, encrypted at rest.</p>
    <div class="chips">
      <span class="chip">Allow only &mdash; never Deny</span>
      <span class="chip">Runs locally, sends nothing</span>
      <span class="chip">6 languages</span>
    </div>
  </div>
</body>
</html>
