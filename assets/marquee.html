<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; background: #fcfcfc;
               color: #111112; font-family: "Optimistic", "optimisticAI", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); }
  .b1 { width: 560px; height: 560px; background: #f3d9b4; left: -190px; top: -240px; opacity: .5; }
  .b2 { width: 560px; height: 560px; background: #cfe2ff; right: -170px; bottom: -260px; opacity: .85; }
  .wrap { position: relative; height: 100%; display: flex; align-items: center; gap: 72px;
          padding: 0 120px; box-sizing: border-box; }
  .copy { flex: 1 1 auto; min-width: 0; }
  .tile { width: 112px; height: 112px; border-radius: 28px; box-shadow: 0 14px 40px rgba(0,64,220,.20); }
  h1 { margin: 26px 0 0; font-size: 58px; font-weight: 500; letter-spacing: -0.015em; }
  p { margin: 14px 0 0; color: #3c4046; font-size: 21px; }
  .chips { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
  .chip { background: rgba(17,17,18,.08); color: #232527; font-size: 16px; font-weight: 500;
          padding: 10px 20px; border-radius: 999px; border: 1px solid rgba(17,17,18,.12); }
  .card { flex: 0 0 400px; background: #fff; border-radius: 20px; padding: 20px 22px 22px;
          box-shadow: 0 24px 70px rgba(17,17,18,.16), 0 0 0 1px rgba(17,17,18,.07); }
  .chead { display: flex; align-items: center; gap: 10px; }
  .chead .mini { width: 34px; height: 34px; border-radius: 9px; }
  .chead b { font-size: 15px; font-weight: 600; }
  .dot { margin-left: auto; width: 9px; height: 9px; border-radius: 50%; background: #31a24c; }
  .crow { display: flex; align-items: center; gap: 9px; margin-top: 16px; font-size: 13px; color: #3c4046; }
  .cbx { width: 30px; height: 17px; border-radius: 999px; background: #0064e0; position: relative; flex: 0 0 auto; }
  .cbx::after { content: ""; position: absolute; right: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; }
  .clog { margin-top: 14px; border-top: 1px solid rgba(17,17,18,.10); }
  .cli { display: flex; align-items: baseline; gap: 8px; padding: 9px 0;
         border-bottom: 1px solid rgba(17,17,18,.08); font-size: 12.5px; }
  .cli:last-child { border-bottom: 0; }
  .cli .t { color: #6a6e74; font-variant-numeric: tabular-nums; }
  .pill { background: rgba(0,100,224,.14); color: #0047a3; font-size: 11px; font-weight: 600;
          padding: 2px 8px; border-radius: 999px; }
  .cli .ctx { color: #3c4046; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
              flex: 1 1 auto; min-width: 0; }
  .cbtn { display: inline-block; margin-top: 16px; background: #005abf; color: #fff; font-size: 13px;
          font-weight: 600; padding: 8px 18px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="wrap">
    <div class="copy">
      <svg class="tile" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="bg" x1="72" y1="60" x2="452" y2="464" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#0082FB"/><stop offset="0.62" stop-color="#0064E0"/><stop offset="1" stop-color="#0040DC"/>
        </linearGradient></defs>
        <rect x="16" y="16" width="480" height="480" rx="133" fill="url(#bg)"/>
        <path d="M118 284 L208 374 L362 182" fill="none" stroke="#fff" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Muse Auto-Allow</h1>
      <p>Approvals on autopilot &mdash; every Allow, instantly.</p>
      <div class="chips">
        <span class="chip">Allow only &mdash; never Deny</span>
        <span class="chip">Local-only, sends nothing</span>
        <span class="chip">6 UI languages</span>
      </div>
    </div>
    <div class="card">
      <div class="chead">
        <svg class="mini" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="bg2" x1="72" y1="60" x2="452" y2="464" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#0082FB"/><stop offset="0.62" stop-color="#0064E0"/><stop offset="1" stop-color="#0040DC"/>
          </linearGradient></defs>
          <rect x="16" y="16" width="480" height="480" rx="133" fill="url(#bg2)"/>
          <path d="M118 284 L208 374 L362 182" fill="none" stroke="#fff" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <b>Muse Auto-Allow</b>
      </div>
      <div class="crow"><span class="cbx"></span>Auto-click Allow</div>
      <div class="clog">
        <div class="cli"><span class="t">15:01</span><span class="pill">allow</span><span class="ctx">Approved pull request read &mdash; demo-project</span></div>
        <div class="cli"><span class="t">14:57</span><span class="pill">allow</span><span class="ctx">Approved branch create &mdash; sample-app</span></div>
      </div>
      <span class="cbtn">Statistics</span>
    </div>
  </div>
</body>
</html>
