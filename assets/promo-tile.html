<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; background: #fcfcfc;
               color: #111112; font-family: "Optimistic", "optimisticAI", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
               -webkit-font-smoothing: antialiased; }
  .blob { position: absolute; border-radius: 50%; filter: blur(46px); }
  .b1 { width: 240px; height: 240px; background: #f3d9b4; left: -70px; top: -80px; opacity: .55; }
  .b2 { width: 220px; height: 220px; background: #cfe2ff; right: -80px; bottom: -90px; opacity: .7; }
  .wrap { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center;
          justify-content: center; text-align: center; }
  .tile { width: 88px; height: 88px; border-radius: 23px; box-shadow: 0 10px 30px rgba(0,64,220,.20); }
  h1 { margin: 15px 0 0; font-size: 26px; font-weight: 500; letter-spacing: -0.01em; }
  p { margin: 5px 0 0; color: #5c6066; font-size: 14px; }
  .chips { display: flex; gap: 8px; margin-top: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(17,17,18,.06); color: #3c4046;
          font-size: 12.5px; font-weight: 500; padding: 5px 12px; border-radius: 999px; }
  .chip .d { width: 7px; height: 7px; border-radius: 50%; }
  .chip .d.blue { background: #0f63e6; } .chip .d.teal { background: #0e8571; } .chip .d.violet { background: #6d3ad6; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="wrap">
    <svg class="tile" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="bg" x1="72" y1="60" x2="452" y2="464" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#0082FB"/><stop offset="0.62" stop-color="#0064E0"/><stop offset="1" stop-color="#0040DC"/>
      </linearGradient></defs>
      <rect x="16" y="16" width="480" height="480" rx="133" fill="url(#bg)"/>
      <path d="M124 284 L214 374 L368 182" fill="none" stroke="#fff" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Muse Auto-Allow</h1>
    <p>Approvals on autopilot &middot; every Allow, instantly.</p>
    <div class="chips">
      <span class="chip"><span class="d blue"></span>Allow-only</span>
      <span class="chip"><span class="d teal"></span>Local-only</span>
      <span class="chip"><span class="d violet"></span>6 languages</span>
    </div>
  </div>
</body>
</html>
